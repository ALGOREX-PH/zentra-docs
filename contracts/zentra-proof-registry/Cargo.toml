[package]
name = "zentra-proof-registry"
version = "0.1.0"
edition = "2021"
description = "Anchor zero-knowledge proofs on-chain for the Zentra dApp — record proof commitments on Soroban."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
