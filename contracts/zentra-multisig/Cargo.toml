[package]
name = "zentra-multisig"
version = "0.1.0"
edition = "2021"
description = "N-of-M multi-signature approval for the Zentra dApp — propose, approve, and execute authorized actions on Soroban."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
