[package]
name = "zentra-action-log"
version = "0.1.0"
edition = "2021"
description = "On-chain action log for the Zentra dApp — record, read, and stream verifiable actions on Soroban."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
zentra-reputation = { path = "../zentra-reputation" }
