[package]
name = "zentra-feedback"
version = "0.1.0"
edition = "2021"
description = "On-chain product feedback for the Zentra dApp — submit, tally, and read ratings on Soroban."

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
