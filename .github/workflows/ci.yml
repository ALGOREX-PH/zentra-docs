name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install
        run: bun install --frozen-lockfile
      - name: Audit dependencies (non-blocking)
        run: bun audit
        continue-on-error: true
      - name: Lint, typecheck and unit tests
        run: bun run check
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Bundle size budget
        run: |
          budget=$((10 * 1024 * 1024))
          size=$(du -sb .next/static | cut -f1)
          echo ".next/static: ${size} bytes (budget: ${budget})"
          [ "$size" -le "$budget" ] || { echo "FAIL: .next/static (${size} bytes) exceeds the 10MB budget"; exit 1; }
